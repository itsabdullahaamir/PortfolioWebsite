<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Abdullah Aamir — a resume, sort of</title>
    <!--
      GitHub Pages has no server-side rewrites, so any direct load of a
      client-routed path (e.g. /PortfolioWebsite/chapters) hits this 404
      page instead of index.html. This re-encodes the path as a query
      string and redirects to the site root, where the inline script in
      index.html decodes it back. Standard "spa-github-pages" trick
      (rafgraph/spa-github-pages), pathSegmentsToKeep = 1 for this
      project-site base path. See public/CLAUDE.md.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
